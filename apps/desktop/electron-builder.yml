appId: io.github.toniqhz.vsscience
productName: VsScience
executableName: VsScience
# Tên file không kèm phiên bản: link releases/latest/download/<tên> luôn trỏ tới bản mới nhất.
artifactName: VsScience-${os}-${arch}.${ext}
directories:
  output: release
  # Logo sản phẩm (icons/icon.png 512×512): electron-builder tự tạo .ico cho Windows và .icns cho Mac.
  buildResources: icons
files:
  - dist/**/*
  - package.json
asar: true
# Chỉ giữ gói ngôn ngữ tiếng Việt và tiếng Anh của Electron (bớt vài chục MB).
electronLanguages:
  - vi
  - en-US
# Nén tối đa (LZMA): build lâu hơn, bộ cài nhỏ hơn.
compression: maximum
extraResources:
  - from: build/resources/web
    to: web
  - from: build/resources/profile
    to: profile
  - from: build/resources/tools
    to: tools
  - from: build/claude/${os}-${arch}
    to: claude
  - from: build/python/${os}-${arch}
    to: python
win:
  target: nsis
  # Không có chứng thư ký số; bỏ bước sửa exe (cần Wine khi build trên Linux).
  signAndEditExecutable: false
nsis:
  oneClick: true
  perMachine: false
  shortcutName: VsScience
mac:
  category: public.app-category.productivity
  # Chưa có Apple Developer ID: ký ad-hoc để chạy được trên máy Apple Silicon.
  identity: '-'
  hardenedRuntime: false
dmg:
  title: VsScience
# Cập nhật từ GitHub Releases: electron-builder tạo latest.yml + blockmap (Windows tự cập nhật bằng electron-updater)
# và app-update.yml trong tài nguyên app. Bộ cài không tự đăng (dist.mjs chạy với --publish never; workflow tự đưa lên).
publish:
  provider: github
  owner: toniqhz
  repo: vsScience
  releaseType: release
