# Build app desktop: bộ cài Windows (.exe NSIS + .zip) và macOS (.dmg + .zip, Apple Silicon và Intel).
# Chạy tay ở tab Actions (workflow_dispatch) hoặc khi đẩy tag v*.
name: Desktop

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ide/desktop dist:${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: BanLamViec-${{ matrix.target }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
          if-no-files-found: error
